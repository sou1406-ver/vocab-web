name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SYNC_EMULATOR_TEST: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test Auth and Firestore rules
        run: >-
          npx -y firebase-tools@latest emulators:exec
          --only auth,firestore --project demo-vocab-sync
          "npx vitest run src/data/sync-emulator.test.ts src/data/usernames-emulator.test.ts"

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Learning and import tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          E2E_PRODUCTION: "1"
        run: npm run e2e -- --workers=2
