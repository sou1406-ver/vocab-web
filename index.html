<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Học 600 Essential Words for the TOEIC theo trường từ: tiền tố, hậu tố, họ từ, đồng nghĩa, trái nghĩa."
    />
    <title>Vocab Learn — 600 Essential Words TOEIC</title>
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#2a4fcf" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,500..700;1,7..72,400..500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Áp dụng giao diện (sáng / tối / theo máy) trước khi vẽ trang để tránh nháy màn hình
      (function () {
        var p = "system";
        try {
          p = localStorage.getItem("vn-theme") || "system";
        } catch (e) {}
        var dark =
          p === "dark" || (p === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
