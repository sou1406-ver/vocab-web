<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VocaNetwork — 600 Essential Words TOEIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Áp dụng giao diện sáng/tối trước khi vẽ trang để tránh nháy màn hình
    (function () {
      var t = null;
      try { t = localStorage.getItem("vn-theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand" data-act="nav" data-href="#/">
        <div class="brand-logo" id="brand-logo"></div>
        <div>
          <div class="brand-name">VocaNetwork</div>
          <div class="brand-sub">600 Essential Words · TOEIC</div>
        </div>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="header-actions">
        <button class="icon-btn" data-act="toggleTheme" title="Đổi giao diện sáng / tối" id="theme-btn"></button>
      </div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
  <div class="toast-wrap" id="toasts"></div>
  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
