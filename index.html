<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VocaNetwork — 600 Essential Words TOEIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,500..700;1,7..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Áp dụng giao diện (sáng / tối / theo máy) trước khi vẽ trang để tránh nháy màn hình
    (function () {
      var p = "system";
      try { p = localStorage.getItem("vn-theme") || "system"; } catch (e) {}
      var dark = p === "dark" || (p === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand" data-act="nav" data-href="#/">
        <div class="brand-logo" id="brand-logo"></div>
        <div>
          <div class="brand-name">VocaNetwork</div>
          <div class="brand-sub">600 Essential Words · TOEIC</div>
        </div>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="header-actions">
        <div class="gsearch" id="gsearch">
          <input id="gsearch-input" class="input" type="search" placeholder="Tìm từ, họ từ, nghĩa Việt…" autocomplete="off" spellcheck="false"
                 aria-label="Tìm từ" aria-controls="gsearch-results" aria-expanded="false" data-input="gSearch">
          <kbd class="gsearch-key" aria-hidden="true">/</kbd>
          <div class="gsearch-results" id="gsearch-results" role="listbox" hidden></div>
        </div>
        <button class="icon-btn gsearch-toggle" data-act="openSearch" title="Tìm từ" aria-label="Tìm từ" id="gsearch-btn"></button>
        <div class="theme-seg" id="theme-seg" role="radiogroup" aria-label="Giao diện sáng / tối"></div>
      </div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
  <div class="toast-wrap" id="toasts"></div>
  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
